name: AI Workbench

on:
  push:
    paths:
      - "agent-workbench/**"
      - ".github/workflows/agent-workbench.yml"
  pull_request:
    paths:
      - "agent-workbench/**"
      - ".github/workflows/agent-workbench.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q ai_workbench aiw.py
      - name: Unit and smoke tests
        run: python -m unittest discover -s tests -v
      - name: CLI help
        run: python aiw.py --help
